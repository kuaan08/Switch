name: Xbox One source audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_preflight:
        description: "Attempt an experimental Windows UWP configure/build (may require extra SDK tools)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Confirm upstream pin and D3D12 patch anchor
        run: python3 tools/xbox_one_overlay.py --check
      - name: Apply Xbox One diagnostic overlay
        run: |
          python3 tools/xbox_one_overlay.py --apply
          python3 tools/xbox_one_overlay.py --apply
          python3 tools/xbox_one_overlay.py --check
          git -C upstream/eden-xbox diff --check
      - name: Compile Python script
        run: python3 -m py_compile tools/xbox_one_overlay.py

  windows-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_preflight
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Apply Xbox One diagnostic
        shell: pwsh
        run: python tools/xbox_one_overlay.py --apply
      - name: Check Windows UWP tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere / Visual Studio missing" }
          & $vswhere -latest -products * -property installationPath
          cmake --version
          Write-Host "Upstream build needs UWP v143, Perl, NASM, and glslangValidator."
      - name: Configure UWP x64 (requires upstream prerequisites)
        shell: cmd
        working-directory: upstream/eden-xbox
        run: call tools\xbox\build-env.bat cmake --preset uwp-x64
      - name: Build UWP emulator frontend (experimental)
        shell: cmd
        working-directory: upstream/eden-xbox
        run: call tools\xbox\build-env.bat cmake --build --preset uwp-x64 --target eden-uwp --parallel 2
