name: Xbox UWP - Normal and Diagnostic APPX

on:
  push:
    branches:
      - feature/xbox-one-fat-eden-source
    paths:
      - '.github/workflows/xbox-one-packages.yml'
      - 'tools/xbox/package-appx.ps1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Pack both UWP variants
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout Xbox source and packaging tools
        uses: actions/checkout@v4

      # Reuse the most recent VERIFIED successful UWP x64 build. Package-only
      # jobs should not waste ~1 hour rebuilding 1,781 native compilation units.
      - name: Download verified UWP executable
        uses: actions/download-artifact@v4
        with:
          name: eden-uwp-x64-unsigned-diagnostic
          run-id: 38510035231
          github-token: ${{ github.token }}
          path: build-uwp/bin

      - name: Validate UWP executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build-uwp/bin/eden-uwp.exe'
          if (!(Test-Path $exe)) { throw "Missing expected UWP executable $exe" }
          Write-Host "Source executable SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          Write-Host "Source compiled from commit: 29d1bdcc31fba4fbd574c76d2a7bc5ab7d43b1dd"

      - name: Compile Mesa SPIR-V-to-DXIL UWP translator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mesaDir = Join-Path (Get-Location).Path 'mesa-build'
          & ./tools/xbox/build-spirv-to-dxil.ps1 -WorkDir $mesaDir
          if ($LASTEXITCODE -ne 0) { throw "Mesa build exited with $LASTEXITCODE" }
          $translator = Join-Path $mesaDir 'build-uwp/src/microsoft/spirv_to_dxil/spirv_to_dxil.dll'
          if (!(Test-Path $translator)) { throw 'Mesa shader translator DLL was not produced' }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            $exports = & $dumpbin.Source /nologo /exports $translator
            if ($exports -notmatch 'eden_spirv_to_dxil_pipeline_v2') {
              throw 'Mesa translator is missing required Eden shader pipeline v2 export'
            }
          }
          Write-Host "Shader DLL SHA256: $((Get-FileHash $translator -Algorithm SHA256).Hash)"

      - name: Package normal (profiling off)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/xbox/package-appx.ps1 -Variant normal -Library -BuildDir build-uwp -OutDir 'build-uwp/package/normal' -SpirvToDxil 'mesa-build/build-uwp/src/microsoft/spirv_to_dxil/spirv_to_dxil.dll' -RequireGpuShaders
          if (!(Test-Path 'build-uwp/package/normal/eden-xbox-normal.appx')) { throw 'Missing normal APPX' }

      - name: Package diagnostic (sampling profiler enabled)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/xbox/package-appx.ps1 -Variant diagnostic -Library -Profile on -BuildDir build-uwp -OutDir 'build-uwp/package/diagnostic' -SpirvToDxil 'mesa-build/build-uwp/src/microsoft/spirv_to_dxil/spirv_to_dxil.dll' -RequireGpuShaders
          if (!(Test-Path 'build-uwp/package/diagnostic/eden-xbox-diagnostic.appx')) { throw 'Missing diagnostic APPX' }

      - name: Inspect both signed APPX packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $sdkBin -Recurse -Filter MakeAppx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like '*\x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$makeappx) { throw 'MakeAppx.exe missing' }
          foreach ($variant in @('normal', 'diagnostic')) {
            $appx = "build-uwp/package/$variant/eden-xbox-$variant.appx"
            & $makeappx.FullName unpack /p $appx /d "build-uwp/verify-$variant" /o
            if ($LASTEXITCODE -ne 0) { throw "APPX unpack failed for $variant" }
            [xml]$m = Get-Content "build-uwp/verify-$variant/AppxManifest.xml"
            $identity = $m.Package.Identity
            Write-Host "$variant => $($identity.Name) x64, publisher $($identity.Publisher)"
            if ($identity.ProcessorArchitecture -ne 'x64') { throw 'Wrong CPU architecture' }
            $config = Get-Content "build-uwp/verify-$variant/boot.cfg" -Raw
            if ($config -notmatch 'library=1') { throw "$variant lacks library mode" }
            if ($variant -eq 'normal' -and $config -match 'profile=') { throw 'Normal package contains profiler options' }
            if ($variant -eq 'diagnostic' -and $config -notmatch 'profile=1') { throw 'Diagnostic package lacks profiler options' }
            if (!(Test-Path "build-uwp/verify-$variant/eden-uwp.exe")) { throw "$variant lacks executable" }
            foreach ($dll in @('spirv_to_dxil.dll', 'dxil.dll')) {
              if (!(Test-Path "build-uwp/verify-$variant/$dll")) { throw "$variant lacks required shader library $dll" }
            }
            Write-Host "$variant verified. SHA256: $((Get-FileHash $appx -Algorithm SHA256).Hash)"
          }

      - name: Upload normal APPX + certificate + runtime
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Xbox-UWP-Normal-APPX
          path: |
            build-uwp/package/normal/eden-xbox-normal.appx
            build-uwp/package/normal/eden-xbox.cer
            build-uwp/package/normal/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic APPX + certificate + runtime
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Xbox-UWP-Diagnostic-APPX
          path: |
            build-uwp/package/diagnostic/eden-xbox-diagnostic.appx
            build-uwp/package/diagnostic/eden-xbox.cer
            build-uwp/package/diagnostic/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error
          retention-days: 7
