name: Xbox One Fat - UWP x64 build attempt

on:
  push:
    branches: [feature/xbox-one-fat-eden-source]
    paths:
      - '.github/workflows/xbox-one-uwp.yml'
      - 'CMakePresets.json'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tools/xbox/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # sccache supports MSVC in Ninja builds. GitHub cache stores compiled outputs
      # using its own content hashes, so flags/headers changes cannot reuse stale objects.
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Checkout original Eden source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore CMake CPM source cache
        id: cpm-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/cpm
          key: cpmsrc-win2022-uwp-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'CMakeModules/**/*.cmake', 'externals/CMakeLists.txt') }}
          restore-keys: |
            cpmsrc-win2022-uwp-v1-

      - name: Enable C++ compiler object cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Inspect Windows UWP toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'Visual Studio Installer / vswhere not found' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'VS2022 C++ toolset missing' }
          Write-Host "VS root: $vs"
          $uwp = & $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC -property installationPath
          Write-Host "UWP C++ component: $(if ($uwp) {'present'} else {'not detected'})"
          foreach ($cmd in 'cmake', 'ninja', 'perl', 'nasm', 'glslangValidator', 'glslang') {
            $found = Get-Command $cmd -ErrorAction SilentlyContinue
            Write-Host "${cmd}: $(if ($found) {$found.Source} else {'missing'})"
          }
          cmake --version

      - name: Install native build utilities
        shell: pwsh
        run: |
          choco install nasm strawberryperl -y --no-progress --limit-output

      - name: Install and verify glslang shader compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip'
          $expected = '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b'
          $zip = Join-Path $env:RUNNER_TEMP 'glslang.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'glslang-unpack'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "glslang release hash mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Get-ChildItem $dir -Filter glslangValidator.exe -Recurse -File |
            Select-Object -First 1
          if (!$binary) {
            $binary = Get-ChildItem $dir -Filter glslang.exe -Recurse -File |
              Select-Object -First 1
          }
          if (!$binary) { throw 'Missing glslang executable in verified release ZIP' }
          $bin = Join-Path $env:RUNNER_TEMP 'glslang-bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item $binary.FullName (Join-Path $bin 'glslangValidator.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'glslangValidator.exe') --version

      - name: Configure UWP x64 for AppContainer
        shell: cmd
        run: call tools\xbox\build-env.bat cmake --preset uwp-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # Save downloaded dependency sources before C++ compilation: even a failed
      # compiler/linker stage should not force a full dependency download again.
      - name: Save CPM source cache for next build
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/cpm
          key: cpmsrc-win2022-uwp-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'CMakeModules/**/*.cmake', 'externals/CMakeLists.txt') }}

      - name: Build Eden UWP frontend
        shell: cmd
        run: call tools\xbox\build-env.bat cmake --build --preset uwp-x64 --target eden-uwp --parallel 2

      - name: Report C++ cache statistics
        if: always()
        shell: pwsh
        run: |
          sccache --show-stats

      - name: Upload unsigned diagnostic EXE (not an installable package)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eden-uwp-x64-unsigned-diagnostic
          path: |
            build-uwp/bin/eden-uwp.exe
            build-uwp/bin/*.dll
          if-no-files-found: error
          retention-days: 7
